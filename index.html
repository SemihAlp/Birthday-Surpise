<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Surprise 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'anthropicSerif', Georgia, 'Times New Roman', serif;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }

        #setup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            background-size: 200% 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 0.5s;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px 0;
        }

        #setup-screen::after {
            content: '';
            display: block;
            height: 1px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        #setup-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #setup-screen .stars {
            position: absolute;
            width: 100%;
            height: 200%;
            pointer-events: none;
        }

        .setup-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
            max-width: 650px;
            width: 90%;
            margin: auto;
            position: relative;
            z-index: 1;
            min-height: min-content;
        }

        .setup-container h1 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 700;
        }

        .setup-container > p {
            color: #666;
            margin-bottom: 25px;
            font-size: clamp(14px, 3vw, 16px);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: clamp(14px, 3vw, 15px);
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #ffe0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: #fff;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 4px rgba(245, 87, 108, 0.1);
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
            font-family: 'anthropicSerif', Georgia, 'Times New Roman', serif;
            line-height: 1.6;
        }

        .photo-upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 480px) {
            .photo-upload-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        .photo-upload-item {
            position: relative;
            aspect-ratio: 3/4;
            border: 3px dashed #ffc0cb;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
            background: linear-gradient(135deg, #fff5f7 0%, #ffe8ec 100%);
            min-height: 180px;
        }

        .photo-upload-item:active {
            transform: scale(0.98);
            border-color: #f5576c;
        }

        .photo-upload-item input {
            display: none;
        }

        .photo-upload-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-upload-item .upload-text {
            color: #f5576c;
            font-size: clamp(13px, 3vw, 14px);
            text-align: center;
            font-weight: 600;
            padding: 10px;
        }

        .char-counter {
            text-align: right;
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .ready-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
            touch-action: manipulation;
        }

        .ready-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.5);
        }

        .ready-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .ready-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #play-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            background-size: 200% 200%;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            overflow: hidden;
        }

        #play-screen.visible {
            display: flex;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        .play-container {
            text-align: center;
            color: #333;
            z-index: 1;
            animation: fadeInUp 1s ease;
            padding: 20px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .play-container .emoji {
            font-size: clamp(60px, 15vw, 80px);
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .play-container h1 {
            font-size: clamp(28px, 7vw, 42px);
            margin-bottom: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            text-shadow: none;
        }

        .play-container p {
            font-size: clamp(16px, 4vw, 22px);
            margin-bottom: 40px;
            color: #666;
            font-weight: 400;
        }

        .play-btn {
            padding: 18px 50px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: clamp(20px, 5vw, 26px);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.4);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
        }

        .play-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .play-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .play-btn:active {
            transform: scale(0.98);
        }

        #terminal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            color: #ffffff;
            padding: 20px;
            font-size: clamp(20px, 5vw, 26px);
            line-height: 1.8;
            font-family: 'Courier New', monospace;
            display: none;
            flex-direction: column;
            justify-content: center;
            z-index: 9998;
            opacity: 1;
            transition: opacity 1s;
        }

        #terminal.visible {
            display: flex;
        }

        #terminal.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .terminal-line {
            margin-bottom: 10px;
        }

        #scene-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s;
            cursor: grab;
            touch-action: none;
        }

        #scene-container.visible {
            opacity: 1;
        }

        #scene-container.dragging {
            cursor: grabbing;
        }

        #controls-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1c1c34;
            color: rgba(255, 255, 255, 0.393);
            padding: 12px 20px;
            border-radius: 20px;
            font-size: clamp(11px, 2.5vw, 14px);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            text-align: center;
            animation: pulse 2s ease-in-out infinite;
            pointer-events: none;
            display: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.05);
            }
        }

        #controls-hint.visible {
            opacity: 1;
            display: block;
        }

        #controls-hint.hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            display: none !important;
            animation: none !important;
        }

        @media (max-width: 768px) {
            #controls-hint {
                font-size: 11px;
                padding: 10px 15px;
            }
        }

        .photo-upload-item:hover {
            border-color: #f5576c;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.2);
        }

        .play-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 50px rgba(245, 87, 108, 0.5);
        }
        
        #close-item-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            cursor: pointer;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            touch-action: manipulation;
        }

        #close-item-btn.visible {
            opacity: 1;
            pointer-events: all;
        }

        #close-item-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.4);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 150;
        }

        .overlay.active {
            opacity: 0;
            pointer-events: all;
        }

        #spotlight {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 1200px;
            height: 1200px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.4) 30%, transparent 60%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 155;
        }

        #spotlight.visible {
            opacity: 1;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="setup-screen">
        <div class="stars"></div>
        <div class="setup-container">
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="font-size: 48px; margin-bottom: 10px;">🎁</div>
                <h1>Prepare a Birthday Surprise</h1>
            </div>
            <p>Create a special birthday experience for your loved one!</p>
            
            <div class="form-group">
                <label>Your Lover's Name *</label>
                <input type="text" id="partner-name" placeholder="..." maxlength="20">
            </div>

            <div class="form-group">
                <label>Photographs (4 pieces) *</label>
                <div class="photo-upload-grid">
                    <div class="photo-upload-item" onclick="document.getElementById('photo1').click()">
                        <input type="file" id="photo1" accept="image/*" onchange="handlePhotoUpload(0, this)">
                        <span class="upload-text">📸 1</span>
                    </div>
                    <div class="photo-upload-item" onclick="document.getElementById('photo2').click()">
                        <input type="file" id="photo2" accept="image/*" onchange="handlePhotoUpload(1, this)">
                        <span class="upload-text">📸 2</span>
                    </div>
                    <div class="photo-upload-item" onclick="document.getElementById('photo3').click()">
                        <input type="file" id="photo3" accept="image/*" onchange="handlePhotoUpload(2, this)">
                        <span class="upload-text">📸 3</span>
                    </div>
                    <div class="photo-upload-item" onclick="document.getElementById('photo4').click()">
                        <input type="file" id="photo4" accept="image/*" onchange="handlePhotoUpload(3, this)">
                        <span class="upload-text">📸 4</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Love Letter *</label>
                <textarea id="love-letter" placeholder="Write special lines for your sweetheart..." maxlength="500" oninput="updateCharCounter()"></textarea>
                <div class="char-counter"><span id="char-count">0</span>/500</div>
            </div>

            <button class="ready-btn" id="ready-btn" onclick="completeSetup()">Ready! 🎉</button>
        </div>
    </div>

    <div id="play-screen">
        <div class="stars"></div>
        <div class="play-container">
            <div class="emoji">💝</div>
            <h1>I Have a Special Surprise for You</h1>
            <p>I've prepared something precious.</p>
            <button class="play-btn"><span style="position: relative; z-index: 1;">Play »</span></button>
        </div>
    </div>

    <div id="terminal">
        <div id="terminal-content"></div>
    </div>

    <div id="scene-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="controls-hint">
        Double tap or press space to blow out the candles
    </div>

    <button id="close-item-btn" onclick="closeCurrentItem()">✕</button>

    <div class="overlay" id="overlay" onclick="closeCurrentItem()"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        const setupStarsContainer = document.querySelector('#setup-screen .stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            setupStarsContainer.appendChild(star);
        }

        const playStarsContainer = document.querySelector('#play-screen .stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            playStarsContainer.appendChild(star);
        }

        document.querySelector('.play-btn').addEventListener('click', startExperience);

        let setupData = {
            partnerName: '',
            photos: [null, null, null, null],
            loveLetter: ''
        };

        let currentOpenItem = null;
        let itemAnimating = false;
        let scene, camera, renderer, raycaster, mouse;
        let birthdayCard, photoFrames = [], cardTextMesh;
        let flames = [];
        let candlesBlown = false;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraRotation = { x: 0, y: 0 };
        let clickableObjects = [];
        let touchStartX = 0;
        let touchStartY = 0;
        let lastTapTime = 0;

        function handlePhotoUpload(index, input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    setupData.photos[index] = e.target.result;
                    const container = input.parentElement;
                    container.innerHTML = '<img src="' + e.target.result + '">';
                    container.onclick = () => {
                        if(confirm('Do you want to change the photo?')) {
                            container.innerHTML = '<input type="file" id="photo' + (index+1) + '" accept="image/*" onchange="handlePhotoUpload(' + index + ', this)"><span class="upload-text">📸 Photo ' + (index+1) + '</span>';
                            container.onclick = () => document.getElementById('photo' + (index+1)).click();
                        }
                    };
                    checkReadyState();
                };
                reader.readAsDataURL(file);
            }
        }

        function updateCharCounter() {
            const textarea = document.getElementById('love-letter');
            const counter = document.getElementById('char-count');
            counter.textContent = textarea.value.length;
            setupData.loveLetter = textarea.value;
            checkReadyState();
        }

        function checkReadyState() {
            const name = document.getElementById('partner-name').value;
            const allPhotos = setupData.photos.every(p => p !== null);
            const letter = setupData.loveLetter.length > 0;
            
            setupData.partnerName = name;
            
            const readyBtn = document.getElementById('ready-btn');
            readyBtn.disabled = !(name && allPhotos && letter);
        }

        document.getElementById('partner-name').addEventListener('input', checkReadyState);

        function completeSetup() {
            document.getElementById('setup-screen').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('play-screen').classList.add('visible');
            }, 500);
        }

        function startExperience() {
            document.getElementById('play-screen').classList.remove('visible');
            document.getElementById('terminal').classList.add('visible');
            setTimeout(() => showNextMessage(), 500);
        }

        const terminalContent = document.getElementById('terminal-content');
        let messages = [];
        let messageIndex = 0;

        function typeMessage(message, callback) {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            terminalContent.appendChild(line);

            let charIndex = 0;
            const typingInterval = setInterval(() => {
                if (charIndex < message.length) {
                    line.textContent += message[charIndex];
                    charIndex++;
                } else {
                    clearInterval(typingInterval);
                    setTimeout(callback, 800);
                }
            }, 50);
        }

        function showNextMessage() {
            messages = [
                '> ' + setupData.partnerName.toLowerCase(),
                '...',
                "> today is your birthday",
                '...',
                '> so i made you this program',
                '...',
                '↖(◠_◠)↗ ↖(◠_◠)↗ ↖(◠_◠)↗',
                '...',
                '> loading your surprise...'
            ];

            if (messageIndex < messages.length) {
                typeMessage(messages[messageIndex], () => {
                    messageIndex++;
                    showNextMessage();
                });
            } else {
                setTimeout(() => {
                    document.getElementById('terminal').classList.add('hidden');
                    document.getElementById('scene-container').classList.add('visible');
                    setTimeout(() => {
                        if (!candlesBlown) {
                            document.getElementById('controls-hint').classList.add('visible');
                        }
                    }, 500);
                    init3DScene();
                }, 1000);
            }
        }

        function init3DScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0a2e);
            scene.fog = new THREE.Fog(0x1a0a2e, 20, 50);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 16);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'),
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const ambientLight = new THREE.AmbientLight(0x404070, 0.3);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.7);
            mainLight.position.set(5, 15, 5);
            mainLight.castShadow = true;
            mainLight.shadow.camera.left = -15;
            mainLight.shadow.camera.right = 15;
            mainLight.shadow.camera.top = 15;
            mainLight.shadow.camera.bottom = -15;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x8899ff, 0.2);
            fillLight.position.set(-5, 10, -5);
            scene.add(fillLight);

            const frontLight = new THREE.DirectionalLight(0xffffff, 0.4);
            frontLight.position.set(0, 5, 10);
            scene.add(frontLight);

            const candleLight = new THREE.PointLight(0xffaa00, 0.7, 10);
            candleLight.position.set(0, 3, 0);
            scene.add(candleLight);

            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2d1b4e,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.15;
            ground.receiveShadow = true;
            scene.add(ground);

            const carpetGeometry = new THREE.CircleGeometry(8, 64);
            const carpetMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8B4789,
                roughness: 0.9,
                metalness: 0.1
            });
            const carpet = new THREE.Mesh(carpetGeometry, carpetMaterial);
            carpet.rotation.x = -Math.PI / 2;
            carpet.position.y = -0.14;
            carpet.receiveShadow = true;
            scene.add(carpet);

            const carpetBorderGeometry = new THREE.RingGeometry(7.8, 8, 64);
            const carpetBorderMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFFD700,
                roughness: 0.4,
                metalness: 0.6
            });
            const carpetBorder = new THREE.Mesh(carpetBorderGeometry, carpetBorderMaterial);
            carpetBorder.rotation.x = -Math.PI / 2;
            carpetBorder.position.y = -0.13;
            scene.add(carpetBorder);

            const tableGroup = new THREE.Group();
            
            const tableTopGeometry = new THREE.BoxGeometry(12, 0.4, 8);
            const tableTopMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8B4513,
                roughness: 0.7,
                metalness: 0.1
            });
            const tableTop = new THREE.Mesh(tableTopGeometry, tableTopMaterial);
            tableTop.position.y = 0;
            tableTop.castShadow = true;
            tableTop.receiveShadow = true;
            tableGroup.add(tableTop);

            tableGroup.position.z = -3;
            scene.add(tableGroup);

            createTableDecorations();

        function createCheckerTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            const squareSize = 64;
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const gradient = ctx.createLinearGradient(
                        i * squareSize, j * squareSize,
                        (i + 1) * squareSize, (j + 1) * squareSize
                    );
                    if ((i + j) % 2 === 0) {
                        gradient.addColorStop(0, '#FFB6C1');
                        gradient.addColorStop(1, '#FFC0CB');
                    } else {
                        gradient.addColorStop(0, '#FFFFFF');
                        gradient.addColorStop(1, '#FFF5F7');
                    }
                    ctx.fillStyle = gradient;
                    ctx.fillRect(i * squareSize, j * squareSize, squareSize, squareSize);
                }
            }
            
            ctx.strokeStyle = '#FF69B4';
            ctx.lineWidth = 2;
            for (let i = 0; i <= 8; i++) {
                ctx.beginPath();
                ctx.moveTo(i * squareSize, 0);
                ctx.lineTo(i * squareSize, 512);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * squareSize);
                ctx.lineTo(512, i * squareSize);
                ctx.stroke();
            }
            
            return new THREE.CanvasTexture(canvas);
        }

        function createTextTexture(text, width, height) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#FFFFF5';
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#ff69b4';
            ctx.font = 'bold 80px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('💌', width / 2, 120);
            
            ctx.fillStyle = '#2c2c2c';
            ctx.font = '42px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.lineWidth = 2;
            
            const lines = wrapText(ctx, text, width - 150);
            let y = 250;
            lines.forEach(line => {
                ctx.fillText(line, width / 2, y);
                y += 60;
            });
            
            return new THREE.CanvasTexture(canvas);
        }

        function wrapText(ctx, text, maxWidth) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';
            
            words.forEach(word => {
                const testLine = currentLine + word + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && currentLine !== '') {
                    lines.push(currentLine);
                    currentLine = word + ' ';
                } else {
                    currentLine = testLine;
                }
            });
            lines.push(currentLine);
            return lines;
        }

        function onTouchStart(e) {
            e.preventDefault();
            if (currentOpenItem) return;
            
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            previousMousePosition = { x: touch.clientX, y: touch.clientY };
            isDragging = true;
        }

        function onTouchMove(e) {
            e.preventDefault();
            if (isDragging && !currentOpenItem && e.touches.length === 1) {
                const touch = e.touches[0];
                const deltaX = touch.clientX - previousMousePosition.x;
                const deltaY = touch.clientY - previousMousePosition.y;

                cameraRotation.y += deltaX * 0.008;
                cameraRotation.x += deltaY * 0.008;

                cameraRotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraRotation.x));

                previousMousePosition = { x: touch.clientX, y: touch.clientY };
            }
        }

        function onTouchEnd(e) {
            e.preventDefault();
            
            if (!isDragging || currentOpenItem) return;
            
            const touch = e.changedTouches[0];
            const deltaX = Math.abs(touch.clientX - touchStartX);
            const deltaY = Math.abs(touch.clientY - touchStartY);
            
            if (deltaX < 10 && deltaY < 10) {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                
                if (tapLength < 300 && tapLength > 0 && !candlesBlown) {
                    blowCandles();
                } else {
                    handleTapOrClick(touch.clientX, touch.clientY);
                }
                
                lastTapTime = currentTime;
            }
            
            isDragging = false;
        }

        function onMouseDown(e) {
            if (currentOpenItem) return;
            isDragging = true;
            document.getElementById('scene-container').classList.add('dragging');
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onMouseMove(e) {
            if (isDragging && !currentOpenItem) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                cameraRotation.y += deltaX * 0.005;
                cameraRotation.x += deltaY * 0.005;

                cameraRotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraRotation.x));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        }

        function onMouseUp() {
            isDragging = false;
            document.getElementById('scene-container').classList.remove('dragging');
        }

        function onMouseClick(event) {
            if (isDragging || itemAnimating || currentOpenItem) return;
            handleTapOrClick(event.clientX, event.clientY);
        }

        function handleTapOrClick(clientX, clientY) {
            if (itemAnimating || currentOpenItem) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                for (let intersect of intersects) {
                    let obj = intersect.object;
                    
                    while (obj) {
                        if (obj.userData && obj.userData.clickable) {
                            openItem3D(obj);
                            return;
                        }
                        obj = obj.parent;
                    }
                }
            }
        }

        function openItem3D(object) {
            if (itemAnimating || currentOpenItem) return;
            
            itemAnimating = true;
            currentOpenItem = object;

            document.getElementById('overlay').classList.add('active');
            document.getElementById('close-item-btn').classList.add('visible');
            document.getElementById('controls-hint').classList.remove('visible');

            const targetPosition = new THREE.Vector3(
                camera.position.x * 0.3,
                camera.position.y * 0.5,
                camera.position.z * 0.3
            );
            const targetRotation = new THREE.Euler(0, 0, 0);
            const targetScale = new THREE.Vector3(2.5, 2.5, 2.5);

            const startPosition = object.position.clone();
            const startRotation = object.rotation.clone();
            const startScale = object.scale.clone();
            
            const duration = 1200;
            const startTime = Date.now();

            function animateOpen() {
                const now = Date.now();
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const eased = 1 - Math.pow(1 - progress, 3);

                object.position.lerpVectors(startPosition, targetPosition, eased);
                
                object.rotation.x = startRotation.x + (targetRotation.x - startRotation.x) * eased;
                object.rotation.y = startRotation.y + (targetRotation.y - startRotation.y) * eased;
                object.rotation.z = startRotation.z + (targetRotation.z - startRotation.z) * eased;
                
                object.scale.lerpVectors(startScale, targetScale, eased);

                if (progress < 1) {
                    requestAnimationFrame(animateOpen);
                } else {
                    itemAnimating = false;
                }
            }

            animateOpen();
        }

        function closeCurrentItem() {
            if (!currentOpenItem || itemAnimating) return;

            itemAnimating = true;

            document.getElementById('overlay').classList.remove('active');
            document.getElementById('close-item-btn').classList.remove('visible');
            document.getElementById('controls-hint').classList.add('visible');

            const object = currentOpenItem;
            const startPosition = object.position.clone();
            const startRotation = object.rotation.clone();
            const startScale = object.scale.clone();

            const targetPosition = object.userData.originalPosition;
            const targetRotation = object.userData.originalRotation;
            const targetScale = object.userData.originalScale;

            const duration = 1200;
            const startTime = Date.now();

            function animateClose() {
                const now = Date.now();
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const eased = progress < 0.5 
                    ? 4 * progress * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                object.position.lerpVectors(startPosition, targetPosition, eased);
                
                object.rotation.x = startRotation.x + (targetRotation.x - startRotation.x) * eased;
                object.rotation.y = startRotation.y + (targetRotation.y - startRotation.y) * eased;
                object.rotation.z = startRotation.z + (targetRotation.z - startRotation.z) * eased;
                
                object.scale.lerpVectors(startScale, targetScale, eased);

                if (progress < 1) {
                    requestAnimationFrame(animateClose);
                } else {
                    itemAnimating = false;
                    currentOpenItem = null;
                }
            }

            animateClose();
        }

        function onKeyDown(event) {
            if (event.code === 'Space' && !candlesBlown && !currentOpenItem) {
                event.preventDefault();
                blowCandles();
            } else if (event.code === 'Escape' && currentOpenItem) {
                event.preventDefault();
                closeCurrentItem();
            }
        }

        function blowCandles() {
            candlesBlown = true;
            
            document.getElementById('controls-hint').classList.add('hidden');
            document.getElementById('controls-hint').classList.remove('visible');
            
            flames.forEach((flame, index) => {
                setTimeout(() => {
                    let scale = 1;
                    const shrinkInterval = setInterval(() => {
                        scale -= 0.1;
                        if (scale <= 0) {
                            clearInterval(shrinkInterval);
                            flame.visible = false;
                            flame.userData.glow.visible = false;
                        } else {
                            flame.scale.set(scale, scale, scale);
                            flame.userData.glow.scale.set(scale * 2, scale * 2, scale * 2);
                            flame.userData.glow.material.opacity = 0.2 * scale;
                        }
                    }, 50);
                }, index * 200);
            });

            setTimeout(() => {
                createConfetti();
            }, 800);
        }

        function createConfetti() {
            const colors = ['#ff0066', '#00ff66', '#0066ff', '#ffff00', '#ff00ff', '#00ffff', '#ff6600', '#ff0099'];
            
            const cakePosition = new THREE.Vector3(0, 2, -4);
            const cakeScreenPosition = cakePosition.clone().project(camera);
            
            const cakeX = (cakeScreenPosition.x * 0.5 + 0.5) * window.innerWidth;
            const cakeY = (-cakeScreenPosition.y * 0.5 + 0.5) * window.innerHeight;
            
            for (let i = 0; i < 200; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = cakeX + 'px';
                    confetti.style.top = cakeY + 'px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 15 + 5 + 'px';
                    confetti.style.height = confetti.style.width;
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = Math.random() * 400 + 200;
                    const tx = Math.cos(angle) * velocity;
                    const ty = Math.sin(angle) * velocity - 200;
                    
                    confetti.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) rotate(' + Math.random() * 720 + 'deg)';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 3000);
                }, i * 15);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!currentOpenItem) {
                const radius = 16;
                camera.position.x = radius * Math.sin(cameraRotation.y) * Math.cos(cameraRotation.x);
                camera.position.z = radius * Math.cos(cameraRotation.y) * Math.cos(cameraRotation.x);
                camera.position.y = 6 + radius * Math.sin(cameraRotation.x);
                camera.lookAt(0, 1, 0);
            } else {
                camera.lookAt(currentOpenItem.position);
            }

            if (!candlesBlown) {
                const time = Date.now() * 0.003;
                flames.forEach((flame) => {
                    flame.position.y = flame.userData.originalY + Math.sin(time * 3 + flame.userData.index) * 0.08;
                    flame.userData.glow.position.copy(flame.position);
                    
                    const flicker = 0.9 + Math.sin(time * 10 + flame.userData.index * 2) * 0.1;
                    flame.material.opacity = flicker;
                    flame.userData.glow.material.opacity = 0.2 * flicker;
                });
            }

            const time = Date.now() * 0.001;
            scene.children.forEach(child => {
                if (child.userData.twinkleSpeed) {
                    const twinkle = Math.sin(time * child.userData.twinkleSpeed + child.userData.twinkleOffset);
                    child.material.opacity = child.userData.originalOpacity * (0.5 + twinkle * 0.5);
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
